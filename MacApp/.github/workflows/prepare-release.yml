name: Prepare release
run-name: Prepare Echo ${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, e.g. 1.0.1 (build number is automatic)'
        required: true
        type: string
      channel:
        description: 'Channel baked into the app; stable candidates stay private until Publish release'
        type: choice
        options: [stable, beta, test]
        default: stable
      release_notes:
        description: 'Reviewed release notes, plain text; one item per line'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: echo-release-preparation
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: write # Private, durable build-number ledger only.
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      ECHO_SIGNING_IDENTITY: ${{ vars.ECHO_SIGNING_IDENTITY || 'B443163B7E1C67F9F7FF981137A23B90887EB3AF' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Identify previous attempt
        id: attempt
        run: echo "previous=$((GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_OUTPUT"
      - name: Recover the previous attempt
        if: github.run_attempt != '1'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: echo-recovery-${{ github.run_id }}-${{ steps.attempt.outputs.previous }}
          path: ${{ runner.temp }}/echo-recovery
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore verified recovery paths
        if: github.run_attempt != '1'
        run: python3 scripts/ci_release.py restore "$RUNNER_TEMP/echo-recovery/recovery.tar.gz"
      - name: Install checksum-pinned Sparkle tools
        run: python3 scripts/ci_signing.py tools
      - name: Mint scoped publisher preflight access
        id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ECHO_RELEASE_APP_ID }}
          private-key: ${{ secrets.ECHO_RELEASE_APP_PRIVATE_KEY }}
          owner: voicelab-uz
          repositories: echo-releases
          permission-contents: write
      - name: Verify publisher access without publishing
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: python3 scripts/ci_release.py verify-publisher
      - name: Prepare temporary signing Keychain
        env:
          ECHO_SIGNING_P12_BASE64: ${{ secrets.ECHO_SIGNING_P12_BASE64 }}
          ECHO_SIGNING_P12_PASSWORD: ${{ secrets.ECHO_SIGNING_P12_PASSWORD }}
          ECHO_NOTARY_KEY_BASE64: ${{ secrets.ECHO_NOTARY_KEY_BASE64 }}
          ECHO_NOTARY_KEY_ID: ${{ vars.ECHO_NOTARY_KEY_ID }}
          ECHO_NOTARY_ISSUER: ${{ vars.ECHO_NOTARY_ISSUER }}
          ECHO_PUSH_PROFILE_BASE64: ${{ secrets.ECHO_PUSH_PROFILE_BASE64 }}
          ECHO_SPARKLE_PRIVATE_KEY: ${{ secrets.ECHO_SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/ci_signing.py setup
      - name: Reserve a build and snapshot the current feed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python3 scripts/ci_release.py plan
      - name: Build, sign, notarize and verify the candidate
        run: python3 scripts/ci_release.py build
      - name: Save the candidate for installation testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: echo-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/candidate/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Save resumable release state
        if: always() && steps.plan.outcome == 'success'
        run: python3 scripts/ci_release.py snapshot "$RUNNER_TEMP/echo-checkpoint/recovery.tar.gz"
      - name: Upload private recovery checkpoint
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: echo-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/echo-checkpoint/recovery.tar.gz
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Remove signing credentials
        if: always()
        run: python3 scripts/ci_signing.py cleanup
