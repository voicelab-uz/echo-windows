name: Echo
options:
  bundleIdPrefix: uz.voicelab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: L5FXR2YA4Q
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "22"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - VoiceInput
      - Shared
    dependencies:
      - target: EchoKeyboard
      - target: EchoLiveActivity
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: VoiceInput/VoiceInput.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.uz.voicelab.echo.shared
    info:
      path: VoiceInput/Info.plist
      properties:
        CFBundleDisplayName: Echo
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        GIDClientID: 37456461335-cosrlss6qr4fss01obdv22ptlad6lffn.apps.googleusercontent.com
        GIDServerClientID: 37456461335-k32kqvncl69ko874mbdtb49boonk1aci.apps.googleusercontent.com
        UILaunchScreen:
          UIColorName: WorkspaceCanvas
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Allows a user-started dictation to continue when returning to another app.
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: uz.voicelab.echo
            CFBundleURLSchemes:
              - voicelab-echo
              - voicelab
              - com.googleusercontent.apps.37456461335-cosrlss6qr4fss01obdv22ptlad6lffn
        NSMicrophoneUsageDescription: Echo records only while you dictate, including from the Echo keyboard.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.voicelab.echo.ios
        TARGETED_DEVICE_FAMILY: "1"
  EchoKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - VoiceKeyboard
      - Shared/VoiceBridge.swift
    entitlements:
      path: VoiceKeyboard/VoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uz.voicelab.echo.shared
    info:
      path: VoiceKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Echo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            # Full Access is required for the shared App Group container.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.voicelab.echo.ios.keyboard
        TARGETED_DEVICE_FAMILY: "1"

  EchoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - EchoLiveActivity
      - Shared/VoiceBridge.swift
      - Shared/EchoLiveActivityAttributes.swift
      - Shared/EchoLiveActivityIntents.swift
    entitlements:
      path: EchoLiveActivity/EchoLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uz.voicelab.echo.shared
    info:
      path: EchoLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Echo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: uz.voicelab.echo.ios.activity
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
